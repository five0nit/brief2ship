[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brief2ship"
version = "0.7.0"
description = "Repo-first discovery for AI coding agents: search and score existing code before building, then ship with proof."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Michael Costea" }]
keywords = [
 "agent-skills",
 "ai-agents",
 "ai-coding",
 "code-search",
 "coding-agents",
 "package-search",
 "repo-first",
 "repository-discovery",
 "verified-delivery",
 "web-scraping",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = []

[project.optional-dependencies]
extract = ["trafilatura>=2.1,<3"]
dev = ["build>=1.2", "trafilatura>=2.1,<3"]

[project.scripts]
brief2ship = "brief2ship.cli:main"

[project.urls]
Homepage = "https://github.com/five0nit/brief2ship"
Repository = "https://github.com/five0nit/brief2ship"
Issues = "https://github.com/five0nit/brief2ship/issues"
Documentation = "https://github.com/five0nit/brief2ship#readme"
Changelog = "https://github.com/five0nit/brief2ship/blob/main/CHANGELOG.md"
"Agent Skill" = "https://github.com/five0nit/brief2ship/tree/main/skills/brief2ship"

[tool.setuptools.packages.find]
where = ["src"]
