[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brief2ship"
version = "0.6.0"
description = "Repo-first code discovery, safe public research, and verified delivery from one brief."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Michael Costea" }]
keywords = ["ai-agents", "code-search", "package-search", "web-scraping", "research", "workflow", "receipts"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = []

[project.optional-dependencies]
extract = ["trafilatura>=2.1,<3"]
dev = ["build>=1.2", "trafilatura>=2.1,<3"]

[project.scripts]
brief2ship = "brief2ship.cli:main"

[project.urls]
Homepage = "https://github.com/five0nit/brief2ship"
Repository = "https://github.com/five0nit/brief2ship"
Issues = "https://github.com/five0nit/brief2ship/issues"

[tool.setuptools.packages.find]
where = ["src"]
